<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار — تتبّع مهاراتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EA;
    --surface:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#5B6B5F;
    --pine:#2F6F5E;
    --pine-dark:#1F4E42;
    --brass:#C98A3E;
    --brass-soft:#EFDBB8;
    --line:#DBDFD3;
    --danger:#B0503A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Tajawal', sans-serif; }

  .wrap{ max-width:1100px; margin:0 auto; padding:36px 24px 80px; }

  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:20px; flex-wrap:wrap;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px; margin-bottom:28px;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:46px; height:46px; border-radius:50%;
    background:var(--pine);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Tajawal',sans-serif; font-weight:900; font-size:20px;
    flex-shrink:0;
  }
  .brand h1{ margin:0; font-size:26px; font-weight:900; }
  .brand p{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }

  .stats{ display:flex; gap:26px; }
  .stat{ text-align:center; }
  .stat b{ display:block; font-family:'Tajawal',sans-serif; font-size:24px; font-weight:900; color:var(--pine-dark); }
  .stat span{ font-size:12px; color:var(--ink-soft); }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1.5px solid var(--line); background:var(--surface);
    padding:7px 16px; border-radius:20px; font-size:13px; cursor:pointer;
    color:var(--ink-soft); font-weight:500; transition:.15s;
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .btn-add{
    background:var(--pine); color:#fff; border:none; border-radius:12px;
    padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Tajawal',sans-serif; display:flex; align-items:center; gap:8px;
    transition:.15s;
  }
  .btn-add:hover{ background:var(--pine-dark); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }

  .card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:16px;
    padding:20px; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; right:0; width:6px; height:100%;
    background:var(--cat-color, var(--pine));
  }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .card-title{ font-family:'Tajawal',sans-serif; font-size:17px; font-weight:700; margin:0; }
  .cat-tag{
    font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px;
    background:var(--cat-bg,var(--brass-soft)); color:var(--cat-color,var(--brass));
    white-space:nowrap;
  }
  .del-btn{
    background:none; border:none; color:#B7B7B0; cursor:pointer; font-size:16px;
    padding:2px 6px; line-height:1;
  }
  .del-btn:hover{ color:var(--danger); }

  .progress-row{ display:flex; align-items:center; gap:10px; margin:14px 0 4px; }
  .progress-bar{ flex:1; height:8px; border-radius:6px; background:var(--line); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--cat-color,var(--pine)); border-radius:6px; transition:width .3s; }
  .progress-pct{ font-size:12px; font-weight:700; color:var(--ink-soft); min-width:32px; text-align:left; }

  .path{ margin-top:14px; display:flex; flex-direction:column; gap:2px; }
  .milestone{
    display:flex; align-items:center; gap:10px; padding:7px 4px;
    cursor:pointer; border-radius:8px; transition:.15s;
  }
  .milestone:hover{ background:var(--bg); }
  .dot{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; transition:.15s;
  }
  .dot.done{ background:var(--cat-color,var(--pine)); border-color:var(--cat-color,var(--pine)); }
  .m-label{ font-size:13.5px; color:var(--ink); }
  .m-label.done{ text-decoration:line-through; color:var(--ink-soft); }

  .empty{
    text-align:center; padding:70px 20px; color:var(--ink-soft);
    border:2px dashed var(--line); border-radius:16px;
  }
  .empty h3{ color:var(--ink); margin-bottom:8px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,42,34,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--surface); border-radius:18px; padding:28px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin:0 0 18px; font-size:20px; }
  label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:14px 0 6px; }
  input[type=text]{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:14px; background:var(--bg);
  }
  input[type=text]:focus{ outline:2px solid var(--pine); outline-offset:1px; }
  .cat-select{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-opt{
    padding:7px 14px; border-radius:20px; border:1.5px solid var(--line); cursor:pointer;
    font-size:13px; font-weight:600;
  }
  .cat-opt.sel{ border-color:currentColor; }
  .milestone-input-row{ display:flex; gap:8px; margin-bottom:8px; }
  .milestone-input-row input{ flex:1; }
  .rm-row{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px; }
  .add-milestone{
    background:none; border:1.5px dashed var(--line); border-radius:10px;
    padding:8px; width:100%; cursor:pointer; color:var(--ink-soft); font-size:13px; margin-top:4px;
  }
  .modal-actions{ display:flex; gap:10px; margin-top:22px; }
  .btn-cancel{
    flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--line);
    background:none; cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:700;
  }
  .btn-save{
    flex:2; padding:11px; border-radius:10px; border:none; background:var(--pine); color:#fff;
    cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:700;
  }
  .btn-save:disabled{ opacity:.5; cursor:not-allowed; }
  ::placeholder{ color:#A5AD9E; }

  @media (max-width:520px){
    .stats{ gap:16px; }
    .stat b{ font-size:19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">م</div>
      <div>
        <h1>مسار</h1>
        <p>ضيف أي مهارة، وابنِ لها طريقك للإتقان</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statSkills">0</b><span>مهارة</span></div>
      <div class="stat"><b id="statDone">0</b><span>خطوة مكتملة</span></div>
      <div class="stat"><b id="statPct">0%</b><span>متوسط الإتقان</span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <button class="btn-add" id="openModal">+ مهارة جديدة</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <h3>ما فيه مهارات بعد</h3>
    <p>ابدأ بإضافة أول مهارة تبي تتقنها — رياضية، علمية، أو أي شي يخطر ببالك.</p>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>مهارة جديدة</h2>
    <label>اسم المهارة</label>
    <input type="text" id="skillName" placeholder="مثال: تعلم العزف على الجيتار">

    <label>التصنيف</label>
    <div class="cat-select" id="catSelect"></div>

    <label>خطوات الإتقان</label>
    <div id="milestonesWrap"></div>
    <button class="add-milestone" id="addMilestoneBtn">+ إضافة خطوة</button>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">إلغاء</button>
      <button class="btn-save" id="saveBtn">حفظ المهارة</button>
    </div>
  </div>
</div>

<script>
const CATS = {
  physical: {label:'بدنية', color:'#2F6F5E', bg:'#DCEAE4'},
  scientific:{label:'علمية', color:'#3D6BB0', bg:'#DCE6F5'},
  creative:  {label:'إبداعية', color:'#C98A3E', bg:'#F5E8D3'},
  other:     {label:'أخرى', color:'#8A5FA6', bg:'#EBDFF2'}
};

let skills = [];
let currentFilter = 'all';
let draftMilestones = [];
let draftCat = 'physical';

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const overlay = document.getElementById('overlay');

async function loadData(){
  try{
    const res = await window.storage.get('skills-data');
    skills = res ? JSON.parse(res.value) : [];
  }catch(e){ skills = []; }
  renderFilters();
  render();
}
async function saveData(){
  try{ await window.storage.set('skills-data', JSON.stringify(skills)); }
  catch(e){ console.error('save failed', e); }
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  const cats = ['all', ...Object.keys(CATS)];
  wrap.innerHTML = cats.map(c => {
    const label = c === 'all' ? 'الكل' : CATS[c].label;
    return `<button class="chip ${currentFilter===c?'active':''}" data-cat="${c}">${label}</button>`;
  }).join('');
  wrap.querySelectorAll('.chip').forEach(btn=>{
    btn.onclick = ()=>{ currentFilter = btn.dataset.cat; renderFilters(); render(); };
  });
}

function render(){
  const list = currentFilter==='all' ? skills : skills.filter(s=>s.cat===currentFilter);
  grid.innerHTML = '';
  emptyState.style.display = skills.length===0 ? 'block' : 'none';
  grid.style.display = skills.length===0 ? 'none' : 'grid';

  list.forEach(skill=>{
    const cat = CATS[skill.cat] || CATS.other;
    const total = skill.milestones.length;
    const done = skill.milestones.filter(m=>m.done).length;
    const pct = total ? Math.round(done/total*100) : 0;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--cat-color', cat.color);
    card.style.setProperty('--cat-bg', cat.bg);
    card.innerHTML = `
      <div class="card-head">
        <h3 class="card-title">${escapeHtml(skill.name)}</h3>
        <button class="del-btn" title="حذف">✕</button>
      </div>
      <span class="cat-tag">${cat.label}</span>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-pct">${pct}%</span>
      </div>
      <div class="path"></div>
    `;
    card.querySelector('.del-btn').onclick = async ()=>{
      skills = skills.filter(s=>s.id!==skill.id);
      await saveData(); render(); updateStats();
    };
    const pathEl = card.querySelector('.path');
    skill.milestones.forEach((m,i)=>{
      const row = document.createElement('div');
      row.className = 'milestone';
      row.innerHTML = `<span class="dot ${m.done?'done':''}">${m.done?'✓':''}</span><span class="m-label ${m.done?'done':''}">${escapeHtml(m.text)}</span>`;
      row.onclick = async ()=>{
        m.done = !m.done;
        await saveData(); render(); updateStats();
      };
      pathEl.appendChild(row);
    });
    grid.appendChild(card);
  });
  updateStats();
}

function updateStats(){
  document.getElementById('statSkills').textContent = skills.length;
  let totalM=0, doneM=0, pctSum=0;
  skills.forEach(s=>{
    totalM += s.milestones.length;
    doneM += s.milestones.filter(m=>m.done).length;
    pctSum += s.milestones.length ? (s.milestones.filter(m=>m.done).length/s.milestones.length*100) : 0;
  });
  document.getElementById('statDone').textContent = doneM;
  document.getElementById('statPct').textContent = skills.length ? Math.round(pctSum/skills.length)+'%' : '0%';
}

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

// modal logic
function openModal(){
  document.getElementById('skillName').value = '';
  draftMilestones = ['', ''];
  draftCat = 'physical';
  renderCatSelect();
  renderMilestoneInputs();
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }

function renderCatSelect(){
  const wrap = document.getElementById('catSelect');
  wrap.innerHTML = Object.entries(CATS).map(([key,c])=>
    `<div class="cat-opt ${draftCat===key?'sel':''}" data-key="${key}" style="color:${c.color};background:${draftCat===key?c.bg:'transparent'}">${c.label}</div>`
  ).join('');
  wrap.querySelectorAll('.cat-opt').forEach(el=>{
    el.onclick = ()=>{ draftCat = el.dataset.key; renderCatSelect(); };
  });
}

function renderMilestoneInputs(){
  const wrap = document.getElementById('milestonesWrap');
  wrap.innerHTML = '';
  draftMilestones.forEach((val,i)=>{
    const row = document.createElement('div');
    row.className = 'milestone-input-row';
    row.innerHTML = `<input type="text" placeholder="خطوة ${i+1}" value="${escapeHtml(val)}"><button class="rm-row">✕</button>`;
    row.querySelector('input').oninput = e=>{ draftMilestones[i] = e.target.value; };
    row.querySelector('.rm-row').onclick = ()=>{
      draftMilestones.splice(i,1);
      renderMilestoneInputs();
    };
    wrap.appendChild(row);
  });
}

document.getElementById('addMilestoneBtn').onclick = ()=>{
  draftMilestones.push('');
  renderMilestoneInputs();
};
document.getElementById('openModal').onclick = openModal;
document.getElementById('cancelBtn').onclick = closeModal;
overlay.onclick = e=>{ if(e.target===overlay) closeModal(); };

document.getElementById('saveBtn').onclick = async ()=>{
  const name = document.getElementById('skillName').value.trim();
  const milestones = draftMilestones.map(t=>t.trim()).filter(Boolean);
  if(!name || milestones.length===0){
    alert('لازم تكتب اسم المهارة وخطوة واحدة على الأقل');
    return;
  }
  skills.unshift({
    id: Date.now().toString(),
    name, cat: draftCat,
    milestones: milestones.map(t=>({text:t, done:false}))
  });
  await saveData();
  closeModal();
  render();
};

loadData();
</script>
</body>
</html>
